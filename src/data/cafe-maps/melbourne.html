/* Layout: one-screen app. Ledger panel on the left, map on the right; stacks map-over-list on phones. */
:root {
  --bg: #f3f2ef;
  --panel: #fbfaf8;
  --ink: #241c17;
  --muted: #6f655d;
  --rule: #e2ddd6;
  --crema: #c9822b;
  --crema-ink: #8a5310;
  --pin-ring: #3a2a1e;
  --approx: #b9a58c;
  --check: #3d6f8f;
  --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tiles: grayscale(.85) contrast(.92) brightness(1.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171310; --panel: #1e1915; --ink: #efe7df; --muted: #a59a90; --rule: #332b25;
    --crema: #e09a45; --crema-ink: #f0b56c; --pin-ring: #f6eadc; --approx: #8b7a66; --check: #7fb0cf;
    --tiles: invert(1) hue-rotate(180deg) grayscale(.9) brightness(.78) contrast(.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171310; --panel: #1e1915; --ink: #efe7df; --muted: #a59a90; --rule: #332b25;
  --crema: #e09a45; --crema-ink: #f0b56c; --pin-ring: #f6eadc; --approx: #8b7a66; --check: #7fb0cf;
  --tiles: invert(1) hue-rotate(180deg) grayscale(.9) brightness(.78) contrast(.9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
.city-nav { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
.city-nav a { color: var(--muted); text-underline-offset: 4px; }
.city-nav a[aria-current="page"] { color: var(--crema-ink); font-weight: 600; }
a:focus-visible, button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--crema-ink); outline-offset: 3px; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
.panel { background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.head { padding: 22px 20px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule); }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; line-height: 1.45; max-width: 60ch; }
.tally { display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.tally b { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.controls { padding: 12px 20px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: 500 12px var(--body); border: 1px solid var(--rule); background: transparent; color: var(--ink); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.seg button:focus-visible, .row:focus-visible, #q:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
#q { width: 100%; box-sizing: border-box; font: 14px var(--body); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 20px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.row:hover, .row.on { background: color-mix(in srgb, var(--crema) 10%, transparent); }
.row .n { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--crema-ink); text-align: right; font-variant-numeric: tabular-nums; }
.row .nm { font-weight: 600; min-width: 0; }
.row .ar { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .dt { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.chip { display: inline-block; font: 500 10px var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.chip.branch { border: 1px dashed var(--crema-ink); color: var(--crema-ink); }
.chip.approx { background: color-mix(in srgb, var(--approx) 30%, transparent); color: var(--ink); }
.chip.check { border: 1px solid var(--check); color: var(--check); }
.sect { padding: 16px 20px 6px; font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.unplaced .row { cursor: default; }
.foot { padding: 14px 20px 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-tile-pane { filter: var(--tiles); }
.leaflet-container { font-family: var(--body); background: var(--bg); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-bottom-color: var(--rule); }
.leaflet-bar a:hover { background: var(--bg); }
.legend { position: absolute; z-index: 500; right: 12px; bottom: 26px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend .sw { width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; flex: none; }
/* pins */
.pin { border-radius: 50%; box-sizing: border-box; display: grid; place-items: center; font: 600 10px var(--mono); color: #fff; background: var(--crema); border: 2px solid var(--pin-ring); box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .15s; }
.pin.branch { background: color-mix(in srgb, var(--crema) 35%, var(--panel)); color: var(--ink); border: 2px dashed var(--crema-ink); }
.pin.approx { background: var(--approx); color: var(--ink); border: 2px solid color-mix(in srgb, var(--pin-ring) 45%, transparent); }
.pin.check { background: var(--crema); border: 3px solid var(--check); }
.leaflet-marker-icon:hover .pin, .pin.on { transform: scale(1.18); }
.sw.ok { background: var(--crema); border: 2px solid var(--pin-ring); }
.sw.branch { background: color-mix(in srgb, var(--crema) 35%, var(--panel)); border: 2px dashed var(--crema-ink); }
.sw.approx { background: var(--approx); }
.sw.check { background: var(--crema); border: 3px solid var(--check); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
.leaflet-popup-content { margin: 12px 14px; line-height: 1.45; }
.pop h3 { font-family: var(--display); font-size: 17px; margin: 0 0 2px; font-weight: 700; }
.pop .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.pop p { margin: 0; font-size: 13px; }
.leaflet-tooltip { background: var(--panel); color: var(--ink); border-color: var(--rule); font: 500 12px var(--body); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52vh auto; height: auto; }
  .mapwrap { order: -1; height: 52vh; }
  .panel { border-right: 0; }
  .list { overflow: visible; }
  .head { padding-top: 16px; }
  h1 { font-size: 24px; }
  .legend { bottom: 18px; right: 8px; padding: 6px 8px; gap: 3px; font-size: 11px; }
  .legend .sw { width: 11px; height: 11px; }
}
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
button.row { width:100%; text-align:left; color:inherit; background:none; border:0; border-bottom:1px solid var(--rule); font:inherit; }
.row .ar { display:block; }
.result-count { margin:0; padding:10px 20px; font-size:12px; color:var(--muted); }
</style>

</head><body>
<div class="app">
  <aside class="panel">
    <header class="head">
<nav class="city-nav" aria-label="Cafe maps"><a href="/">Naman</a><a href="/cafes/melbourne/" aria-current="page">Melbourne</a><a href="/cafes/new-york/">New York</a></nav>
      <h1>Melbourne Cafe Map</h1>
      <p class="sub">An earlier snapshot of 83 Melbourne cafes, sized by card purchases. The Notion list has since grown; newer additions are not on this map yet.</p>
      <div class="tally" id="tally"></div>
    </header>
    <div class="controls">
      <div class="seg" role="group" aria-label="Show">
        <button id="f-all" data-f="all" aria-pressed="true">All</button>
        <button id="f-flag" data-f="flag" aria-pressed="false">Needs a look</button>
      </div>
      <div class="seg" role="group" aria-label="Sort">
        <button id="s-visits" data-s="visits" aria-pressed="true">Most visits</button>
        <button id="s-last" data-s="last" aria-pressed="false">Most recent</button>
        <button id="s-name" data-s="name" aria-pressed="false">A–Z</button>
      </div>
      <input id="q" type="search" placeholder="Search cafe or suburb" aria-label="Search cafe or suburb">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="Map of cafes"></div>
    <div class="legend" aria-label="Legend">
      <div><span class="sw ok"></span>Venue location</div>
      <div><span class="sw branch"></span>Branch unclear</div>
      <div><span class="sw approx"></span>Approximate location</div>
      <div><span class="sw check"></span>Check location</div>
    </div>
  </main>
</div>

<script type="application/json" id="cafe-data">__CAFE_DATA__</script>
<script src="/cafes/leaflet.js"></script>
<script src="/cafes/map.js"></script>
</body></html>
